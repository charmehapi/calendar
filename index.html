<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>マイカレンダー</title>
<style>
:root{box-sizing:border-box;--bg:#fffafc;--fg:#4a4458;--sub:#a79fb5;--line:#f1e6ef;--accent:#ee8fb2;--sun:#ef7f8f;--satc:#7aa7e0;--sheet:#fffdfe;--dim:#fbf3f8;--field:#f7ecf4;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b26;--fg:#f0e9f5;--sub:#9a91aa;--line:#352f40;--accent:#f39ab9;--sun:#ff8f9f;--satc:#8fb8f0;--sheet:#2a2533;--dim:#19161f;--field:#363043;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1b26;--fg:#f0e9f5;--sub:#9a91aa;--line:#352f40;--accent:#f39ab9;--sun:#ff8f9f;--satc:#8fb8f0;--sheet:#2a2533;--dim:#19161f;--field:#363043;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#banner{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:linear-gradient(135deg,#ffd6e8,#e6d8ff 55%,#cfe8ff);color:#5a4a6a}
#banner h1{margin:0;font-size:18px;font-weight:600}
#pn{flex:none;max-height:36vh;min-height:88px;overflow-y:auto;border-top:1px solid var(--line);background:var(--sheet);padding:8px 12px 4px;box-sizing:border-box}
.pt{font-weight:600;font-size:16px;margin-bottom:4px}.ps{font-size:13px;color:var(--sub);margin-bottom:6px}.pm{font-size:14px;white-space:pre-wrap;margin:4px 0 6px;padding:8px;background:var(--field);border-radius:10px}
.cell.selc{box-shadow:inset 0 0 0 2px var(--accent)}
#tb{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--bg)}
#tb button{flex:1;padding:11px 2px;font-size:13px;white-space:nowrap}
#tb #prev,#tb #next{flex:none;width:44px;font-size:20px;padding:6px 0}

button{font:inherit;color:var(--fg);background:var(--field);border:0;border-radius:12px;padding:7px 11px;cursor:pointer}
button.on{background:var(--accent);color:#fff}
button.pri{background:var(--accent);color:#fff}
button.del{color:var(--sun)}
#wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--sub);padding:2px 0;border-bottom:1px solid var(--line)}
#grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 1px;overflow:hidden;min-width:0}
.cell.other{background:var(--dim);color:var(--sub)}
.cell.over{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-size:12px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;margin:0 auto 1px}
.sun .num{color:var(--sun)}.sat .num{color:var(--satc)}
.num.today{background:var(--accent);color:#fff}
.chip{font-size:10px;line-height:15px;height:15px;border-radius:6px;padding:0 4px;margin-top:1px;color:#4a4458;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip.src{opacity:.35}
.more{font-size:10px;color:var(--sub);text-align:center}
#ghost{position:fixed;z-index:100;pointer-events:none;width:92px;transform:translate(-50%,-130%);opacity:.92;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet{background:var(--sheet);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#sheet h3{margin:0 0 10px;font-size:17px}
#sheet input,#sheet textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:0;border-radius:8px;padding:9px;margin-bottom:8px}
#sheet input[type=checkbox]{width:auto;margin:0 4px 0 0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{margin:0!important;flex:1}
.btns{justify-content:flex-end;margin-top:6px}
#sw{display:flex;flex-wrap:wrap;gap:4px 6px;margin:4px 0 8px}.swc{display:flex;flex-direction:column;align-items:center;width:52px}.swc .sw{display:block}.swn{font-size:10px;color:var(--sub);height:14px;line-height:14px;max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-sizing:border-box}
.sw.sel{border-color:var(--fg)}
.item{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.item small{color:var(--sub)}
#st{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.stp{width:38px;height:38px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:21px;border:2px solid transparent;box-sizing:border-box}.stp.sel{border-color:var(--accent)}
#login{position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:300}
#lbox{width:min(320px,86%);text-align:center}#lbox h2{margin:0 0 18px;font-size:20px}#lbox input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:0;border-radius:12px;padding:12px;margin-bottom:10px}#lbox button{width:100%;padding:12px;font-size:16px}#lerr{color:var(--sun);font-size:13px;margin-top:10px;min-height:18px}#lload{color:var(--sub)}
.swr{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swr .item{position:relative;background:var(--sheet);border-bottom:0;touch-action:pan-y;transition:transform .18s}
.acts{position:absolute;right:0;top:0;bottom:0;width:140px;display:flex}
.acts button{flex:1;border-radius:0;color:#fff;font-size:13px;padding:0}
.a-ed{background:#8fb8f0}.a-cp{background:#b9a2e8}.a-dl{background:#ef8f9f}
.eh{position:sticky;top:0;margin:-16px -16px 16px;padding:10px 16px;background:var(--sheet);z-index:2;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
.chip.cs{border-radius:6px 0 0 6px;margin-right:-2px}.chip.cm{border-radius:0;margin-left:-2px;margin-right:-2px}.chip.ce{border-radius:0 6px 6px 0;margin-left:-2px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:200}
</style>
</head>
<body>
<div id="banner"><span>📅</span><h1 id="title"></h1><span id="cloud">🌸</span></div>
<div id="wk"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div>
<div id="grid"></div>
<div id="pn"></div>
<div id="tb"><button id="prev">‹</button><button id="today">今日</button><button id="next">›</button><button id="addb" class="pri">＋追加</button><button id="copy">ドラッグ複製</button><button id="cfg">⚙</button></div>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="login" style="display:flex"><div id="lload">読み込み中…</div><div id="lbox" style="display:none"><h2>📅 マイカレンダー</h2><input id="lem" type="email" placeholder="メールアドレス" autocomplete="username"><input id="lpw" type="password" placeholder="パスワード" autocomplete="current-password"><button class="pri" id="lgo">ログイン</button><div id="lerr"></div></div></div>
<script>
var COLORS=['#ff9aa2','#ffc78f','#fdf0a0','#b5e8a8','#a0e4d9','#a9cdf5','#cdb4f0','#d3d3da','#ffb6d0','#d4e8a0','#bfe3f2','#e8d5c0'];
var DOW='日月火水木金土';
var $=function(s){return document.querySelector(s)};
var events=[],cur=new Date(),copyMode=false,press=null,navTimer=null,navKey=null,noClick=false;
cur.setDate(1);
try{events=JSON.parse(localStorage.getItem('cal-events')||'[]')}catch(e){events=[]}
var OLDC=['#ef5350','#fb8c00','#fdd835','#43a047','#26a69a','#1e88e5','#8e24aa','#757575'];
events.forEach(function(e){var i=OLDC.indexOf(e.color);if(i>=0)e.color=COLORS[i]});
var cnames={};try{cnames=JSON.parse(localStorage.getItem('cal-colornames')||'{}')}catch(e){cnames={}}
function saveNames(){try{localStorage.setItem('cal-colornames',JSON.stringify(cnames))}catch(e){}if(window.cloudSave)window.cloudSave()}
var corder=[];try{corder=JSON.parse(localStorage.getItem('cal-colororder')||'[]')}catch(e){corder=[]}
function ordered(){var o=corder.filter(function(c){return COLORS.indexOf(c)>=0});COLORS.forEach(function(c){if(o.indexOf(c)<0)o.push(c)});return o}
function saveOrder(){try{localStorage.setItem('cal-colororder',JSON.stringify(ordered()))}catch(e){}if(window.cloudSave)window.cloudSave()}
var DEFAULT_STAMPS=['🍻','🍽️','🎂','🎉','✈️','💼','🏥','📞','🏃','🎮','🛒','📚','🚗','🎬','💇','✂️','💅','💆','🛁','💄','🌸','🦷','💊','🏋️','☕','🎤','🎁','❤️'];
var stamps=DEFAULT_STAMPS.slice();
try{var _s=JSON.parse(localStorage.getItem('cal-stamps')||'null');if(Array.isArray(_s)&&_s.length)stamps=_s}catch(e){}
function saveStamps(){try{localStorage.setItem('cal-stamps',JSON.stringify(stamps))}catch(e){}if(window.cloudSave)window.cloudSave()}
function splitEmoji(t){var a=[];try{var sg=new Intl.Segmenter(undefined,{granularity:'grapheme'});for(var x of sg.segment(t)){if(x.segment.trim())a.push(x.segment)}}catch(e){a=Array.from(t.replace(/\s/g,''))}return a.slice(0,48)}
function save(){try{localStorage.setItem('cal-events',JSON.stringify(events))}catch(e){}if(window.cloudSave)window.cloudSave()}
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cmp(a,b){if(isM(a)!==isM(b))return isM(a)?-1:1;if(isM(a)&&a.date!==b.date)return a.date<b.date?-1:1;return a.allDay===b.allDay?(a.start||'').localeCompare(b.start||''):(a.allDay?-1:1)}
function label(e){return (e.stamp?e.stamp+' ':'')+(e.allDay||!e.start||window.innerWidth<600?'':e.start+' ')+e.title}
function toast(t){var x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){x.style.display='none'},1400)}
function isM(e){return !!(e.endDate&&e.endDate>e.date)}
function inDay(e,s){return e.date<=s&&(e.endDate||e.date)>=s}
function addDays(s,n){var d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ds(d)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)}
function moveEv(ev,date){if(ev.endDate)ev.endDate=addDays(date,dayDiff(ev.date,ev.endDate));ev.date=date}
function mkChip(e,s,col){
  var c=document.createElement('div');c.className='chip';c.dataset.id=e.id;
  var t=label(e);
  if(s&&isM(e)){var st=s===e.date;c.classList.add(st?'cs':(s===e.endDate?'ce':'cm'));if(!st&&col!==0)t='\u00a0'}
  c.textContent=t;c.style.background=e.color;return c}
function shift(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}
function render(){
  var y=cur.getFullYear(),m=cur.getMonth();
  $('#title').textContent=y+'年'+(m+1)+'月';
  var start=new Date(y,m,1-new Date(y,m,1).getDay()),today=ds(new Date()),g=$('#grid');
  g.innerHTML='';
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),s=ds(d),c=document.createElement('div');
    c.className='cell'+(d.getMonth()!==m?' other':'')+(i%7===0?' sun':'')+(i%7===6?' sat':'');
    c.dataset.date=s;if(s===sel)c.classList.add('selc');
    var n=document.createElement('div');n.className='num'+(s===today?' today':'');n.textContent=d.getDate();c.appendChild(n);
    var list=events.filter(function(e){return inDay(e,s)}).sort(cmp);
    list.slice(0,2).forEach(function(e){c.appendChild(mkChip(e,s,i%7))});
    if(list.length>2){var mo=document.createElement('div');mo.className='more';mo.textContent='+'+(list.length-2);c.appendChild(mo)}
    g.appendChild(c);
  }
  panel();
}
function sheet(h){$('#sheet').innerHTML=h;$('#ov').style.display='flex';$('#sheet').scrollTop=0}
function closeSheet(){$('#ov').style.display='none'}
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet()});
function openDayOld(s){
  var d=new Date(s+'T00:00'),list=events.filter(function(e){return e.date===s}).sort(cmp);
  var h='<h3>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）</h3>';
  list.forEach(function(e){h+='<div class="item" data-id="'+e.id+'"><span class="dot" style="background:'+e.color+'"></span><span>'+esc((e.stamp?e.stamp+' ':'')+e.title)+' <small>'+(e.allDay?'終日':esc(e.start||''))+(cnames[e.color]?' ・'+esc(cnames[e.color]):'')+'</small></span></div>'});
  if(!list.length)h+='<p style="color:var(--sub)">予定はありません</p>';
  h+='<div class="row btns"><button id="dc">閉じる</button><button class="pri" id="da">＋ 予定を追加</button></div>';
  sheet(h);
  $('#dc').onclick=closeSheet;$('#da').onclick=function(){openEdit(null,s)};
  document.querySelectorAll('.item').forEach(function(it){it.onclick=function(){openEdit(it.dataset.id)}});
}
function openEdit(id,date){
  var ex=id?events.find(function(e){return e.id===id}):null;
  var e=ex||{title:'',date:date,allDay:false,start:'09:00',end:'10:00',color:COLORS[5],memo:''},col=e.color,stp=e.stamp||'';
  sheet('<div class="eh"><button id="fc">キャンセル</button><b>'+(ex?'予定を編集':'予定を追加')+'</b><button class="pri" id="fv">保存</button></div><input id="ft" placeholder="タイトル"><div class="row"><input id="fd" type="date"><label><input id="fa" type="checkbox">終日</label></div><div class="row"><span style="font-size:13px;color:var(--sub);white-space:nowrap">終了日（2日以上のとき）</span><input id="fd2" type="date"></div><div class="row" id="ftm"><input id="fs" type="time"><span>〜</span><input id="fe" type="time"></div><div id="sw"></div><div class="row"><input id="cn" placeholder="この色の名前（例：プライベート）"><button id="cl">← 左へ</button><button id="cr">右へ →</button></div><div id="st"></div><textarea id="fm" rows="3" placeholder="メモ"></textarea>'+(ex?'<div class="row btns"><button class="del" id="fx">削除</button><button id="fk">この日付にコピー</button></div>':'')+'');
  $('#ft').value=e.title;$('#fd').value=e.date;$('#fd2').value=e.endDate||'';$('#fa').checked=!!e.allDay;$('#fs').value=e.start||'';$('#fe').value=e.end||'';$('#fm').value=e.memo||'';
  function tm(){$('#ftm').style.display=$('#fa').checked?'none':'flex'}
  tm();$('#fa').onchange=tm;
  function lbl(c){return cnames[c]||''}
  function buildSw(){$('#sw').innerHTML='';ordered().forEach(function(c){var w=document.createElement('div');w.className='swc';var s=document.createElement('span');s.className='sw'+(c===col?' sel':'');s.style.background=c;var n=document.createElement('span');n.className='swn';n.textContent=lbl(c);w.appendChild(s);w.appendChild(n);w.onclick=function(){col=c;document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});s.classList.add('sel');$('#cn').value=lbl(c)};$('#sw').appendChild(w)})}
  buildSw();
  $('#cn').value=lbl(col);
  $('#cn').oninput=function(){var v=$('#cn').value.trim();if(v)cnames[col]=v;else delete cnames[col];saveNames();buildSw()};
  function mv(d){var o=ordered(),i=o.indexOf(col),j=i+d;if(i<0||j<0||j>=o.length)return;o.splice(i,1);o.splice(j,0,col);corder=o;saveOrder();buildSw()}
  $('#cl').onclick=function(){mv(-1)};$('#cr').onclick=function(){mv(1)};
  [''].concat(stamps).forEach(function(s){var b=document.createElement('span');b.className='stp'+(s===stp?' sel':'');b.textContent=s||'なし';if(!s)b.style.fontSize='11px';b.onclick=function(){stp=s;document.querySelectorAll('.stp').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')};$('#st').appendChild(b)});
  $('#fc').onclick=closeSheet;if(!ex)$('#ft').focus();
  if(ex)$('#fk').onclick=function(){var d=$('#fd').value;if(!d||d===ex.date){toast('先に上の日付をコピー先に変えてください');return}events.push({id:uid(),title:$('#ft').value.trim()||'（無題）',date:d,endDate:($('#fd2').value>d?$('#fd2').value:''),allDay:$('#fa').checked,start:$('#fs').value,end:$('#fe').value,color:col,stamp:stp,memo:$('#fm').value});save();render();closeSheet();toast('コピーしました')};
  if(ex)$('#fx').onclick=function(){events=events.filter(function(x){return x.id!==ex.id});save();render();closeSheet()};
  $('#fv').onclick=function(){
    var o={id:ex?ex.id:uid(),title:$('#ft').value.trim()||'（無題）',date:$('#fd').value||date||ds(new Date()),endDate:($('#fd2').value>($('#fd').value||date||'')?$('#fd2').value:''),allDay:$('#fa').checked,start:$('#fs').value,end:$('#fe').value,color:col,stamp:stp,memo:$('#fm').value};
    if(ex)Object.assign(ex,o);else events.push(o);
    sel=o.date;selId=null;
    save();render();closeSheet();
  };
}
var sel=ds(new Date()),selId=null,copySrc=null;
function fmtD(s){var d=new Date(s+'T00:00');return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）'}
function selectDay(s){sel=s;selId=null;render()}
function tapEvent(id,el){
  var cell=el&&el.closest('.cell');
  if(copySrc){if(cell)copyTo(cell.dataset.date);return}
  var ev=events.find(function(x){return x.id===id});if(!ev)return;
  sel=ev.date;selId=null;render();
}
function copyTo(date){var c=Object.assign({},copySrc);c.id=uid();moveEv(c,date);events.push(c);save();toast(fmtD(date)+'にコピーしました');render()}
var openRow=null,lastSwipe=0;
function closeRow(r){if(!r)return;r.classList.remove('open');r.querySelector('.item').style.transform=''}
function bindSwipe(r){
  var c=r.querySelector('.item'),id=r.dataset.id,W=140,x0=0,y0=0,base=0,dx=0,drag=false,on=false;
  c.addEventListener('pointerdown',function(e){on=true;drag=false;x0=e.clientX;y0=e.clientY;dx=0;base=r.classList.contains('open')?-W:0});
  c.addEventListener('pointermove',function(e){
    if(!on)return;dx=e.clientX-x0;var dy=e.clientY-y0;
    if(!drag&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag=true;if(openRow&&openRow!==r)closeRow(openRow);try{c.setPointerCapture(e.pointerId)}catch(x){}}
    if(drag){c.style.transition='none';c.style.transform='translateX('+Math.max(-W,Math.min(0,base+dx))+'px)'}
  });
  function end(){
    if(!on)return;on=false;c.style.transition='';
    if(drag){lastSwipe=Date.now();if(base+dx<-W/2){r.classList.add('open');c.style.transform='translateX('+(-W)+'px)';openRow=r}else{r.classList.remove('open');c.style.transform='';if(openRow===r)openRow=null}}
  }
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  c.addEventListener('click',function(){
    if(Date.now()-lastSwipe<300)return;
    if(r.classList.contains('open')){closeRow(r);openRow=null;return}
    openEdit(id);
  });
  
  r.querySelector('.a-cp').onclick=function(){copySrc=events.find(function(x){return x.id===id});render()};
  r.querySelector('.a-dl').onclick=function(){events=events.filter(function(x){return x.id!==id});save();render()};
}
function panel(){
  var p=$('#pn'),h='';
  var ev=selId?events.find(function(x){return x.id===selId}):null;
  if(selId&&!ev)selId=null;
  if(copySrc){
    p.innerHTML='<div class="pt">コピー先の日付をタップ</div><div class="ps">「'+esc((copySrc.stamp?copySrc.stamp+' ':'')+copySrc.title)+'」をコピーします。月は左右スワイプか「‹ ›」で切り替えられます。</div><div class="row btns"><button class="pri" id="pdone">完了</button></div>';
    $('#pdone').onclick=function(){copySrc=null;render()};return;
  }
  if(ev){
    p.innerHTML='<div class="pt"><span class="dot" style="display:inline-block;background:'+ev.color+'"></span> '+esc((ev.stamp?ev.stamp+' ':'')+ev.title)+'</div><div class="ps">'+fmtD(ev.date)+'　'+(ev.allDay?'終日':esc(ev.start||'')+(ev.end?' 〜 '+esc(ev.end):''))+(cnames[ev.color]?'　・'+esc(cnames[ev.color]):'')+'</div>'+(ev.memo?'<div class="pm">'+esc(ev.memo)+'</div>':'')+'<div class="row btns"><button id="pb">‹ 一覧</button><button class="del" id="pdl">削除</button><button id="pcp">コピー</button><button class="pri" id="ped">編集</button></div>';
    $('#pb').onclick=function(){selId=null;render()};
    $('#pdl').onclick=function(){events=events.filter(function(x){return x.id!==ev.id});save();selId=null;render()};
    $('#pcp').onclick=function(){copySrc=ev;render()};
    $('#ped').onclick=function(){openEdit(ev.id)};
    return;
  }
  var list=events.filter(function(e){return inDay(e,sel)}).sort(cmp);
  h='<div class="pt">'+fmtD(sel)+'</div>';
  list.forEach(function(e){h+='<div class="swr" data-id="'+e.id+'"><div class="acts"><button class="a-cp">コピー</button><button class="a-dl">削除</button></div><div class="item"><span class="dot" style="background:'+e.color+'"></span><span>'+esc((e.stamp?e.stamp+' ':'')+e.title)+' <small>'+(e.allDay?'終日':esc(e.start||'')+(e.end?'〜'+esc(e.end):''))+(isM(e)?' '+e.date.slice(5).replace('-','/')+'〜'+e.endDate.slice(5).replace('-','/'):'')+'</small></span></div></div>'});
  if(!list.length)h+='<div class="ps">予定はありません（「＋追加」で追加）</div>';
  p.innerHTML=h;
  p.querySelectorAll('.swr').forEach(bindSwipe);
}
function openCfg(){
  sheet('<h3>スタンプの編集</h3><p class="ps">使いたい絵文字を並べて入力してください（スペースは不要です）。</p><textarea id="sti" rows="2"></textarea><div class="row btns"><button id="str">初期に戻す</button><button class="pri" id="sts">スタンプを保存</button></div><h3>バックアップ</h3><p style="font-size:13px;color:var(--sub);margin:0 0 8px">下の文字列をコピーして、メモなどに保存しておけます。別の端末やブラウザに貼り付ければ復元できます。</p><textarea id="cj" rows="8"></textarea><div class="row btns"><button id="cb">閉じる</button><button id="cp">コピー</button><button class="pri" id="ci">この内容で置き換える</button></div><div class="row btns"><button class="del" id="co">ログアウト</button></div>');
  $('#cj').value=JSON.stringify({events:events,names:cnames,order:ordered()});
  $('#cb').onclick=closeSheet;
  $('#sti').value=stamps.join('');
  $('#sts').onclick=function(){var a=splitEmoji($('#sti').value);if(!a.length){toast('絵文字を入力してください');return}stamps=a;saveStamps();toast('スタンプを保存しました')};
  $('#str').onclick=function(){stamps=DEFAULT_STAMPS.slice();saveStamps();$('#sti').value=stamps.join('');toast('初期に戻しました')};
  $('#co').onclick=function(){if(window.cloudLogout)window.cloudLogout();else toast('ログアウトできません')};
  $('#cp').onclick=function(){var t=$('#cj');t.select();try{if(navigator.clipboard)navigator.clipboard.writeText(t.value);else document.execCommand('copy');toast('コピーしました')}catch(x){toast('手動でコピーしてください')}};
  $('#ci').onclick=function(){try{var a=JSON.parse($('#cj').value);if(Array.isArray(a)){events=a}else if(a&&Array.isArray(a.events)){events=a.events;cnames=a.names||{};saveNames();corder=a.order||[];saveOrder()}else throw 0;save();render();closeSheet();toast('読み込みました')}catch(x){toast('形式が正しくありません')}};
}
/* ドラッグ＆ドロップ（タッチは長押しで開始、マウスは動かすだけ） */
function activate(){
  if(!press||press.dead)return;
  press.active=true;
  var ev=events.find(function(e){return e.id===press.id});if(!ev)return;
  var g=mkChip(ev);g.id='ghost';document.body.appendChild(g);
  press.el.classList.add('src');
  moveGhost(press.cx,press.cy);
}
function moveGhost(x,y){var g=$('#ghost');if(g){g.style.left=x+'px';g.style.top=y+'px';g.textContent=(copyMode||press.alt?'＋ ':'')+g.textContent.replace(/^＋ /,'')}}
function stopNav(){clearInterval(navTimer);navTimer=null;navKey=null}
function onMove(e){
  if(!press)return;
  press.cx=e.clientX;press.cy=e.clientY;press.alt=e.ctrlKey||e.altKey;
  if(!press.active){
    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>8){
      if(press.type==='mouse')activate();else{clearTimeout(press.timer);press.dead=true}
    }
    return;
  }
  moveGhost(e.clientX,e.clientY);
  var el=document.elementFromPoint(e.clientX,e.clientY);
  document.querySelectorAll('.over').forEach(function(x){x.classList.remove('over')});
  var cell=el&&el.closest('.cell');if(cell)cell.classList.add('over');
  var nb=el&&el.closest('#prev,#next'),k=nb?nb.id:null;
  if(k!==navKey){stopNav();if(k){navKey=k;navTimer=setInterval(function(){shift(k==='next'?1:-1)},700)}}
}
function onUp(e){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);
  var p=press;press=null;if(!p)return;
  clearTimeout(p.timer);stopNav();
  var g=$('#ghost');if(g)g.remove();
  document.querySelectorAll('.over,.src').forEach(function(x){x.classList.remove('over');x.classList.remove('src')});
  if(!p.active){if(!p.dead&&e.type==='pointerup')tapEvent(p.id,p.el);return}
  noClick=true;setTimeout(function(){noClick=false},400);
  if(e.type==='pointercancel')return;
  var el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest('.cell');
  if(!cell)return;
  var ev=events.find(function(x){return x.id===p.id});if(!ev)return;
  var date=cell.dataset.date,copy=copyMode||e.ctrlKey||e.altKey;
  if(copy){var c=Object.assign({},ev);c.id=uid();moveEv(c,date);events.push(c);toast('コピーしました')}
  else if(ev.date!==date){moveEv(ev,date);toast('移動しました')}
  else return;
  save();render();
}
$('#grid').addEventListener('pointerdown',function(e){
  var ch=e.target.closest('.chip');if(!ch)return;
  press={id:ch.dataset.id,el:ch,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,type:e.pointerType,active:false,dead:false};
  if(e.pointerType!=='mouse')press.timer=setTimeout(activate,350);
  window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
});
$('#grid').addEventListener('click',function(e){
  if(noClick||e.target.closest('.chip'))return;
  var c=e.target.closest('.cell');if(c){if(copySrc)copyTo(c.dataset.date);else selectDay(c.dataset.date)}
});
$('#grid').addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('selectstart',function(e){var n=e.target.nodeType===1?e.target:e.target.parentElement;if(!n||!n.closest('input,textarea'))e.preventDefault()});
$('#prev').onclick=function(){shift(-1)};
$('#next').onclick=function(){shift(1)};
$('#today').onclick=function(){cur=new Date();cur.setDate(1);sel=ds(new Date());selId=null;render()};
$('#copy').onclick=function(){copyMode=!copyMode;$('#copy').classList.toggle('on',copyMode);toast(copyMode?'コピーモード：ドロップで複製':'移動モード')};
$('#cfg').onclick=openCfg;
$('#addb').onclick=function(){openEdit(null,sel)};
var sx=0,sy=0,sw=false;
$('#grid').addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;sw=!e.target.closest('.chip')&&e.touches.length===1},{passive:true});
$('#grid').addEventListener('touchend',function(e){if(!sw)return;sw=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){noClick=true;setTimeout(function(){noClick=false},350);shift(dx<0?1:-1)}},{passive:true});
render();
setTimeout(function(){if(!window.fbReady){$('#login').style.display='none';var b=$('#cloud');if(b){b.textContent='⚠️';b.title='オフライン（この端末のデータのみ）'}}},5000);
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({
  apiKey:"AIzaSyDYx9w4RU7jyZU3iV6ghfUrFLGqWMBRflo",
  authDomain:"my-calendar-80118.firebaseapp.com",
  projectId:"my-calendar-80118",
  storageBucket:"my-calendar-80118.firebasestorage.app",
  messagingSenderId:"626587177237",
  appId:"1:626587177237:web:41b88a2ba4ddde2ffe591c"
});
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const q=s=>document.querySelector(s);
let ref=null,unsub=null,timer=null,ready=false;
function badge(t,tip){const b=q('#cloud');if(b){b.textContent=t;b.title=tip||''}}
function showLogin(v){
  q('#login').style.display=v?'flex':'none';
  q('#lbox').style.display=v?'block':'none';
  q('#lload').style.display='none';
}
function payload(){return {events:window.events||[],names:window.cnames||{},order:window.ordered?window.ordered():[],stamps:window.stamps||[],updated:Date.now()}}
window.cloudSave=function(){
  if(!ref||!ready)return;
  badge('⏳','保存中');
  clearTimeout(timer);
  timer=setTimeout(function(){
    setDoc(ref,payload()).then(function(){badge('☁️','同期済み')}).catch(function(){badge('⚠️','同期できませんでした')});
  },300);
};
function apply(d){
  window.events=d.events||[];window.cnames=d.names||{};window.corder=d.order||[];if(d.stamps&&d.stamps.length)window.stamps=d.stamps;
  try{
    localStorage.setItem('cal-events',JSON.stringify(window.events));
    localStorage.setItem('cal-colornames',JSON.stringify(window.cnames));
    localStorage.setItem('cal-colororder',JSON.stringify(window.corder));localStorage.setItem('cal-stamps',JSON.stringify(window.stamps));
  }catch(e){}
  window.render();
}
onAuthStateChanged(auth,async function(user){
  window.fbReady=true;
  if(unsub){unsub();unsub=null}
  ready=false;
  if(!user){ref=null;badge('🌸');showLogin(true);return}
  showLogin(false);badge('⏳','読み込み中');
  ref=doc(db,'users',user.uid,'data','calendar');
  const flag='cal-merged-'+user.uid;
  let merged=false;
  try{merged=!!localStorage.getItem(flag)}catch(e){}
  if(!merged){
    try{
      const cur=await getDoc(ref);
      const c=cur.exists()?cur.data():{events:[],names:{},order:[]};
      const ids=new Set((c.events||[]).map(e=>e.id));
      const events=(c.events||[]).concat((window.events||[]).filter(e=>!ids.has(e.id)));
      const names=Object.assign({},window.cnames||{},c.names||{});
      const order=(c.order&&c.order.length)?c.order:(window.corder||[]);
      await setDoc(ref,{events:events,names:names,order:order,updated:Date.now()});
      try{localStorage.setItem(flag,'1')}catch(e){}
    }catch(e){badge('⚠️','同期できませんでした')}
  }
  unsub=onSnapshot(ref,function(snap){
    if(snap.metadata.hasPendingWrites&&ready)return;
    if(snap.exists())apply(snap.data());
    ready=true;
    if(!snap.exists())window.cloudSave();
    else badge('☁️','同期済み');
  },function(){badge('⚠️','同期できませんでした')});
});
q('#lgo').onclick=async function(){
  const em=q('#lem').value.trim(),pw=q('#lpw').value;
  q('#lerr').textContent='';
  if(!em||!pw){q('#lerr').textContent='メールアドレスとパスワードを入力してください';return}
  q('#lgo').disabled=true;
  try{await signInWithEmailAndPassword(auth,em,pw)}
  catch(e){q('#lerr').textContent='ログインできませんでした（'+(e.code||'error')+'）。メールアドレスとパスワードを確認してください。'}
  q('#lgo').disabled=false;
};
q('#lpw').addEventListener('keydown',function(e){if(e.key==='Enter')q('#lgo').click()});
window.cloudLogout=function(){window.closeSheet();signOut(auth)};

</script>
